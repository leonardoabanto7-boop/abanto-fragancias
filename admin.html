<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración | Abanto Fragancias</title>
    <link rel="stylesheet" href="css/estilos.css">
    <style>
        body { font-family: Arial, sans-serif; background: #f6f6f6; color: #171717; }
        main { max-width: 1100px; margin: 35px auto; padding: 20px; }
        .panel, .formulario, .producto {
            background: white; padding: 22px; margin: 18px 0;
            border: 1px solid #ddd; border-radius: 8px;
        }
        .campos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
        label { display: block; font-size: 14px; margin-bottom: 6px; }
        input, select, textarea {
            width: 100%; box-sizing: border-box; padding: 11px;
            border: 1px solid #bbb; border-radius: 4px; font: inherit;
        }
        textarea { min-height: 80px; resize: vertical; }
        button { padding: 11px 16px; border: 0; border-radius: 4px; cursor: pointer; margin: 5px 5px 5px 0; }
        .principal { background: #171717; color: white; }
        .secundario { background: #e5e5e5; color: #171717; }
        .peligro { background: #a52626; color: white; }
        .lista { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
        .producto img { width: 100%; height: 210px; object-fit: contain; background: #fafafa; }
        .producto h3 { margin-bottom: 8px; }
        .producto p { overflow-wrap: anywhere; }
        .estado { padding: 10px 0; white-space: pre-wrap; }
        .oculto { display: none; }
        @media (max-width: 600px) {
            main { padding: 12px; }
            .campos { grid-template-columns: 1fr; }
        }
       #formProducto label {
    font-weight: 700;
}

#formProducto label:has(input[type="checkbox"]) {
    font-weight: 400;
}

#formProducto h2,
#formProducto h3 {
    font-weight: 700;
}

    </style>
</head>

$("imagen").addEventListener("change", () => {
    archivosOrdenados = Array.from($("imagen").files).slice(0, 3);
    mostrarVistaPrevia();
});

function mostrarVistaPrevia() {
    const contenedor = $("vistaPreviaImagenes");
    contenedor.replaceChildren();

    archivosOrdenados.forEach((archivo, indice) => {
        const fila = document.createElement("div");
        const imagen = document.createElement("img");
        imagen.src = URL.createObjectURL(archivo);
        imagen.style.width = "70px";
        imagen.style.height = "70px";
        imagen.style.objectFit = "contain";

        const texto = document.createElement("span");
        texto.textContent = ` Imagen ${indice + 1}: ${archivo.name} `;

        const arriba = document.createElement("button");
        arriba.type = "button";
        arriba.textContent = "↑";
        arriba.disabled = indice === 0;
        arriba.onclick = () => {
            [archivosOrdenados[indice - 1], archivosOrdenados[indice]] =
                [archivosOrdenados[indice], archivosOrdenados[indice - 1]];
            mostrarVistaPrevia();
        };

        const abajo = document.createElement("button");
        abajo.type = "button";
        abajo.textContent = "↓";
        abajo.disabled = indice === archivosOrdenados.length - 1;
        abajo.onclick = () => {
            [archivosOrdenados[indice], archivosOrdenados[indice + 1]] =
                [archivosOrdenados[indice + 1], archivosOrdenados[indice]];
            mostrarVistaPrevia();
        };

        fila.append(imagen, texto, arriba, abajo);
        contenedor.appendChild(fila);
    });
}
function mostrarMensaje(id, texto) {

}

function valorNumero(id) {

$("vistaPreviaImagenes").replaceChildren();

    }

    const listaArabes = $("listaArabes");
const listaDisenador = $("listaDisenador");
const listaNicho = $("listaNicho");

listaArabes.replaceChildren();
listaDisenador.replaceChildren();
listaNicho.replaceChildren();

    if (!data || data.length === 0) {
        mostrarMensaje("mensajeLista", "Todavía no hay perfumes registrados.");

    mostrarMensaje("mensajeLista", "Productos registrados: " + data.length);

    data.forEach(producto => {

            "5 ml: " + (producto.precio_5ml ?? "—") + " S/\n" +

        tarjeta.appendChild(detalle);

        const editar = document.createElement("button");
        editar.className = "secundario";
        editar.textContent = "Editar";
        editar.addEventListener("click", () => editarProducto(producto));
        tarjeta.appendChild(editar);

        const eliminar = document.createElement("button");
        eliminar.className = "peligro";

        eliminar.addEventListener("click", () => eliminarProducto(producto));

        const categoria = (producto.categoria || "").toLowerCase();

if (categoria.includes("nicho")) {
    listaNicho.appendChild(tarjeta);
} else if (
    categoria.includes("diseñador") ||
    categoria.includes("disenador")
) {

} else {
    listaArabes.appendChild(tarjeta);
}
    });
}

    console.log("SE EJECUTÓ EDITAR:", p.nombre);
    $("productoId").value = p.id;

    $("precio3").value = p.precio_3ml ?? "";

document.querySelectorAll('input[name="aroma"]').forEach(casilla => {

document.querySelectorAll('input[name="estacion"]').forEach(casilla => {

});
    $("descripcion").value = p.descripcion || "";

    $("disponible10ml").checked = p.disponible_10ml !== false;
    $("disponibleFrasco").checked = p.disponible_frasco !== false;
if ($("agotadoGeneral")) {
    $("agotadoGeneral").checked =
        p.disponible_3ml === false &&
        p.disponible_5ml === false &&

}
    imagenActual = p.imagenes?.length

    $("tituloFormulario").textContent = "Editar perfume";

    $("cancelarEdicion").classList.remove("oculto");
    mostrarMensaje("mensajeProducto", "Editando: " + (p.nombre || ""));
    setTimeout(() => {

    if (formulario) {
        formulario.scrollIntoView({

        });

}, 100);

async function subirImagenes(archivos) {
    const urls = [];

    for (const archivo of archivos) {
        const nombreSeguro = archivo.name.replace(/[^a-zA-Z0-9._-]/g, "_");
        const ruta = Date.now() + "-" + urls.length + "-" + nombreSeguro;

        const { error } = await supabaseClient.storage
            .from("perfumes")
            .upload(ruta, archivo, { upsert: false });

        if (error) throw error;

        const { data } = supabaseClient.storage
            .from("perfumes")
            .getPublicUrl(ruta);

        urls.push(data.publicUrl);
    }

    return urls;
}

async function eliminarProducto(producto) {
    if (!confirm("¿Seguro que deseas eliminar " + producto.nombre + "?")) return;

    const { error } = await supabaseClient
        .from("productos")
        .delete()
        .eq("id", producto.id);

    if (error) {
        alert("No se pudo eliminar: " + error.message);
        return;
    }

    alert("Producto eliminado.");
    await cargarProductos();
}

            arabe: "Perfumes árabes",
            disenador: "Perfumes de diseñador",
            nicho: "Perfumes de nicho"
        };

        Object.entries(listas).forEach(([clave, lista]) => {
            const mostrar = categoria === "todos" || categoria === clave;
            lista.style.display = mostrar ? "grid" : "none";

            const titulo = lista.previousElementSibling;
            if (titulo && titulo.tagName === "H3") {
                titulo.style.display = mostrar ? "" : "none";
            }
        });
    });
});
</script>
</body>
</html>
